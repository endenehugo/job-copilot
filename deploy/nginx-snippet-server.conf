# Job Copilot —— server 级公共配置 + 全部 location
# 由 /etc/nginx/sites-available/job-copilot 的 IP 块与 443 块共同 include，
# 避免 HTTP/HTTPS 两份 location 各改一遍（SSE 缓冲、proxy 超时最容易漏）。
#
# 安装位置：/etc/nginx/snippets/job-copilot-server.conf

root /var/www/job-copilot;
index index.html;

# 上传上限 20MB + 余量；缺这一行会让简历/截图上传报 413
client_max_body_size 25m;
client_body_timeout 120s;

access_log /var/log/nginx/job-copilot.access.log;
error_log  /var/log/nginx/job-copilot.error.log warn;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

# ------------------------------------------------------------------
# 应用没有登录态，放公网等于把 DashScope 额度开放给所有人。
# 需要门禁时执行：sudo bash /opt/job-copilot/deploy/enable-basic-auth.sh
# ------------------------------------------------------------------

gzip on;
gzip_comp_level 5;
gzip_min_length 1k;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Vite 产物带内容 hash，可长期缓存
location /assets/ {
    expires 30d;
    try_files $uri =404;
}

# SSE 流式对话：必须关缓冲，否则打字机效果会被 Nginx 攒成整段下发。
# 用 location = 精确匹配，避免被下面的 /api/ 规则抢走。
location = /api/v1/conversation/chat/stream {
    proxy_pass http://job_copilot_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 常规接口：LLM 长请求，读超时给足（默认 60s 会在长回答上 504）
location /api/ {
    proxy_pass http://job_copilot_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 历史消息里持久化的图片 URL，没有 /api/v1 前缀
location /conversation/image/ {
    proxy_pass http://job_copilot_backend;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
}

# ielts-daily 每日精读材料（另一个项目挂在本站的路径入口）
include /etc/nginx/snippets/ielts-daily-location.conf;

# SPA 路由回退（前端用 history 路由，直刷子路径必须回 index.html）
location / {
    try_files $uri $uri/ /index.html;
}
