# Job Copilot —— Docker 路线的 Nginx 配置（被打进 frontend 镜像的 /etc/nginx/conf.d/default.conf）
# 宿主上手工部署请改用 deploy/nginx-host.conf（proxy_pass 指向 127.0.0.1:8000、root 指向 /var/www/job-copilot）。
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 流式接口：必须关闭缓冲，否则打字机效果会被 Nginx 攒成整段
    location = /api/v1/conversation/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 常规接口（LLM 长请求，超时给足）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 历史消息中持久化的图片 URL（无 /api/v1 前缀）
    location /conversation/image/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;
    }
}
