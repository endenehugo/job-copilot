# Job Copilot —— Docker 路线（与宿主机 systemd 路线二选一）
#
# 在仓库根目录执行（-f 指向本文件时，build context 相对本文件解析，故用 .. 回到仓库根）：
#   cp .env.example .env      # 补齐 DASHSCOPE_API_KEY、MYSQL_ROOT_PASSWORD、MYSQL_PASSWORD
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#   docker compose --env-file .env -f deploy/docker-compose.yml logs -f backend
#
# 说明：compose 的 ${VAR} 插值只读 --env-file 指定的文件（默认是当前工作目录的 .env），
# 显式写 --env-file 可以避免「配置文件在 deploy/ 而 .env 在根目录」带来的取值歧义。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_copilot}
      MYSQL_USER: ${MYSQL_USER:-jobcopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    # 资源上限：三者同机，任何一个失控（OOM/死循环）都不能拖垮宿主机上的另外两个
    mem_limit: 1g

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: prod
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 中设置}
      METASO_API_KEY: ${METASO_API_KEY:-}
      # JWT 签名密钥：生产必填（缺失时应用启动即失败，见 core/config.py）
      AUTH_SECRET: ${AUTH_SECRET:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MULTIMODAL_MODEL: ${MULTIMODAL_MODEL:-}
      # 计量与配额（公网防滥用，见 core/llm_usage.py；0 = 不限）
      LLM_USAGE_LOG: ${LLM_USAGE_LOG:-true}
      VISITOR_DAILY_CHAT_LIMIT: ${VISITOR_DAILY_CHAT_LIMIT:-30}
      GLOBAL_DAILY_TOKEN_LIMIT: ${GLOBAL_DAILY_TOKEN_LIMIT:-800000}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-jobcopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_copilot}
    volumes:
      # 运行态数据（上传/解析/索引/导出）与容器生命周期解耦
      - resources-data:/opt/job-copilot/resources
    depends_on:
      mysql:
        condition: service_healthy
    # 探测真实健康（含 DB 连通）：/health 带 SELECT 1 的 db 探测。
    # restart 策略只救"进程退出"，healthcheck 标记 unhealthy 供监控与 depends_on 用；
    # slim 镜像没有 curl，用标准库 urllib 探测。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # BGE reranker（数百 MB）+ FAISS + 进程内缓存都在这个容器里
    mem_limit: 2g

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m

volumes:
  mysql-data:
  resources-data:
