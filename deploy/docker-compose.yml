services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_copilot}
      MYSQL_USER: ${MYSQL_USER:-jobcopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: prod
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 中设置}
      METASO_API_KEY: ${METASO_API_KEY:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-jobcopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_copilot}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
