# Job Copilot —— Nginx 站点配置【域名 + HTTPS】
#
# 安装位置：/etc/nginx/sites-available/job-copilot-https
# 安装方式：sudo bash deploy/enable-https.sh --domain displaydemo.top \
#               --pem /etc/nginx/ssl/displaydemo.top.pem --key /etc/nginx/ssl/displaydemo.top.key
#
# 与 /etc/nginx/sites-available/job-copilot（裸 IP 的 HTTP 站点）并存：
#   1. 裸 IP  :80 / :8080  → 继续走 HTTP（IP 上没有有效证书，跳过 TLS）
#   2. 域名   :80           → 301 到 HTTPS（含 www）
#   3. 域名   :443          → 真正提供应用
#
# 依赖片段：/etc/nginx/snippets/job-copilot-server.conf
#   upstream job_copilot_backend 在 nginx-host.conf 里定义，同进程内全局可见，此处不重复定义
#   （重复定义 upstream 会让 nginx -t 报 duplicate upstream）。
#
# 证书：阿里云免费证书（DigiCert DV），SAN 通常同时含根域与 www，
# 有效期 3 个月，需手动续期并替换 /etc/nginx/ssl/ 下的文件后 reload。

# ----------------------------------------------------------------------
# 1) 域名的 HTTP：一律跳 HTTPS
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # ACME 验证目录要放行，否则将来用 certbot 换证书会被 301 卡住
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# 2) 域名的 HTTPS
# ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/nginx/ssl/__CERT_BASENAME__.pem;
    ssl_certificate_key /etc/nginx/ssl/__CERT_BASENAME__.key;

    # 阿里云免费证书为 DigiCert DV，TLS1.2/1.3 足够，关掉 1.0/1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 这里**故意不加 HSTS**：证书 3 个月手动续期，一旦续期失败，HSTS 会让浏览器
    # 在 max-age 内拒绝降级回 HTTP，用户直接白屏。等续期跑稳一轮再考虑加。

    include /etc/nginx/snippets/job-copilot-server.conf;
}
