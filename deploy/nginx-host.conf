# Job Copilot —— 宿主机部署（systemd + uvicorn）的 Nginx 站点配置【HTTP / 裸 IP】
#
# 安装位置：/etc/nginx/sites-available/job-copilot
# 安装方式：sudo bash deploy/bootstrap.sh
#
# 本文件只负责「裸 IP + 8080 备用入口」的 HTTP 访问，故意不含域名与证书：
# 域名和 443 在另一份 deploy/nginx-https.conf 里，由 deploy/enable-https.sh 安装。
# 拆开的原因：IP 上没有有效证书，一旦合并成一个 server 块并做 HTTPS 跳转，
# 裸 IP 访问就会因为「证书不匹配」而不可用。
#
# 依赖片段：/etc/nginx/snippets/job-copilot-server.conf
#   （root / 日志 / gzip / 全部 location，与 443 站点共用，避免改一处漏一处）

upstream job_copilot_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    # __SERVER_NAME__ 由 bootstrap.sh 替换成公网 IP 或 --domain 传入的域名；
    # 若你手工安装，务必替换，否则请求匹配不到这个 server 块。
    server_name __SERVER_NAME__;

    include /etc/nginx/snippets/job-copilot-server.conf;
}
