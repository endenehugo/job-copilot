# Job Copilot —— 宿主机部署（systemd + uvicorn）的 Nginx 站点配置
#
# 安装位置：/etc/nginx/sites-available/job-copilot
# 启用：
#   sudo bash deploy/bootstrap.sh          # 推荐：会自动注入 server_name（公网 IP 或 --domain 指定的域名）
# 手工启用：
#   sudo sed "s/__SERVER_NAME__/<公网IP或域名>/" deploy/nginx-host.conf \
#        | sudo tee /etc/nginx/sites-available/job-copilot >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/job-copilot /etc/nginx/sites-enabled/job-copilot
#   sudo nginx -t && sudo systemctl reload nginx
#
# 端口说明：实测阿里云上海节点 **裸 IP 走 80 是通的**——受限的是"未备案域名"；
# 8080 作为备用入口同时保留。备案完成后把 server_name 换成域名，再用 certbot 加 443
# （见部署指南附录 B）。
#
# 注意：nginx 的 include 是 sites-enabled/*，文件名带 .disabled 后缀也会被加载；
# 要停用某个站点必须把它移出 sites-enabled 目录。

upstream job_copilot_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    # __SERVER_NAME__ 由 bootstrap.sh 替换成公网 IP 或 --domain 传入的域名；
    # 若你手工安装，务必替换，否则请求匹配不到这个 server 块。
    server_name __SERVER_NAME__;

    root /var/www/job-copilot;
    index index.html;

    # 上传上限 20MB + 余量；缺这一行会让简历/截图上传报 413
    client_max_body_size 25m;
    client_body_timeout 120s;

    access_log /var/log/nginx/job-copilot.access.log;
    error_log  /var/log/nginx/job-copilot.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ------------------------------------------------------------------
    # 可选但强烈建议：应用本身没有登录态，只要放公网就等于把 DashScope
    # 额度开放给所有人。启用 Basic Auth：
    #   sudo htpasswd -c /etc/nginx/.htpasswd jobcopilot
    #   # 输入两次密码后，取消下面两行注释
    # auth_basic "Job Copilot";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # ------------------------------------------------------------------

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite 产物带内容 hash，可长期缓存
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # SSE 流式对话：必须关缓冲，否则打字机效果会被 Nginx 攒成整段下发。
    # 用 location = 精确匹配，避免被下面的 /api/ 规则抢走。
    location = /api/v1/conversation/chat/stream {
        proxy_pass http://job_copilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 常规接口：LLM 长请求，读超时给足（默认 60s 会在长回答上 504）
    location /api/ {
        proxy_pass http://job_copilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 历史消息里持久化的图片 URL，没有 /api/v1 前缀
    location /conversation/image/ {
        proxy_pass http://job_copilot_backend;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }

    # SPA 路由回退（前端用 history 路由，直刷子路径必须回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
