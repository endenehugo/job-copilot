name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # 测试不需要外部 MySQL/LLM：全套件用 SQLite 内存库替换 DatabaseManager、
      # mock 全部模型调用（见 tests/conftest.py 与 test_e2e_api 的说明）
      - run: pip install -r requirements-dev.txt
      - name: Ruff（错误类规则基线，见 pyproject.toml）
        run: ruff check .
      - name: Pytest（425 用例）
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 生产构建
        run: npm run build
